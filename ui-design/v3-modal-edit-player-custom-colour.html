<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom colour step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1F5F99}a:hover{color:#174A78}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #141A26; position: relative; overflow: hidden">

  <div style="background: #2268A6; height: 128px; border-radius: 0 0 26px 26px"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14,18,26,0.55)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 225px; background: #FFFFFF; border-radius: 26px 26px 0 0"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14,18,26,0.45)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="ccTitle" style="position: absolute; left: 16px; right: 16px; top: 96px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 20px 50px rgba(14,18,26,0.3); display: flex; flex-direction: column">

    <div style="display: flex; align-items: center; gap: 6px; padding: 12px 20px 0 8px">
      <a href="v3-modal-edit-player.html" aria-label="Back to Edit player" style="width: 44px; height: 44px; border-radius: 12px; color: #141A26; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: #5A6478">EDIT PLAYER</div>
        <div id="ccTitle" style="font-size: 20px; font-weight: 800">Custom colour</div>
      </div>
    </div>

    <div style="padding: 22px 20px 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 120px; height: 120px; border-radius: 50%; background: #F8DDF6; color: #8A1C84; font-size: 44px; font-weight: 800; display: flex; align-items: center; justify-content: center">T</span>
      <div style="font-size: 17px; font-weight: 800">tiffany</div>
    </div>

    <div style="padding: 18px 20px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; background: #53926B; border-radius: 14px; padding: 8px 12px">
        <div style="display: flex; align-items: center">
        <span style="position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #E9918C; background: #F8DDF6; color: #8A1C84; box-sizing: border-box; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">T</span>
        <span style="height: 28px; margin-left: -12px; padding: 0 12px 0 18px; border-radius: 0 999px 999px 0; background: #D0544C; color: #FFFFFF; font-size: 13px; font-weight: 800; display: block; line-height: 28px">tiffany</span>
        </div>
        <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.18em; color: rgba(255,255,255,0.85)">ON COURT</span>
      </div>
    </div>

    <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: #5A6478">HUE</div>
        <div style="font-size: 12px; font-weight: 600; color: #8A93A6">Slide to change</div>
      </div>
      <div role="slider" aria-label="Avatar hue" aria-valuemin="0" aria-valuemax="360" aria-valuenow="302" tabindex="0" style="position: relative; height: 32px; border-radius: 999px; background: linear-gradient(90deg, hsl(0,70%,62%), hsl(45,80%,55%), hsl(90,55%,50%), hsl(150,55%,46%), hsl(195,70%,50%), hsl(240,65%,64%), hsl(285,60%,62%), hsl(330,70%,62%), hsl(360,70%,62%))">
        <span style="position: absolute; left: 83.9%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: #F8DDF6; border: 4px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 2px 8px rgba(14,18,26,0.35)"></span>
      </div>
    </div>

    <div style="margin-top: 24px; padding: 14px 20px 18px; border-top: 1px solid #EEF1F5">
      <a href="v3-modal-edit-player-custom-in-use.html" style="height: 50px; border-radius: 14px; background: #2268A6; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Use this colour</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
