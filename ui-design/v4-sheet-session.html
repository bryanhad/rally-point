      <div style="display: flex; gap: 6px">

        </button>

    </div>

    <div style="flex: 1; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px">

      <div style="background: #F5F7FA; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: #5A6478">STARTED</div>
        <div style="font-size: 20px; font-weight: 800">Today · 19:00</div>
        <div style="font-size: 13px; color: #5A6478">Saturday, 7 November 2026</div>
      </div>

      <div style="background: #F5F7FA; border-radius: 18px; padding: 14px 12px 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: #5A6478">PLAYERS</div>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="display: flex">
            <span style="width: 34px; height: 34px; border-radius: 50%; background: #D5F0EC; color: #0F6B5E; border: 2.5px solid #F5F7FA; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">B</span>
            <span style="width: 34px; height: 34px; border-radius: 50%; background: #FBE1EC; color: #A3245C; border: 2.5px solid #F5F7FA; margin-left: -10px; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">T</span>

          </div>
          <div style="flex: 1; font-size: 15px; font-weight: 800">8 players</div>
          <a href="v4-modal-session-players.html" style="height: 40px; padding: 0 12px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #D3D8E1; color: #1F5F99; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; text-decoration: none; box-sizing: border-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M19 8v6"/><path d="M16 11h6"/></svg>Edit
          </a>

      </div>

      <a href="v4-modal-game-counts.html" style="background: #F5F7FA; border-radius: 18px; padding: 14px 12px 14px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #141A26">

        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 15px; font-weight: 800">Game counts</div>
          <div style="font-size: 13px; color: #5A6478">12 games played this session</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </div>

    <div style="padding: 12px 16px 20px; border-top: 1px solid #EEF1F5">
      <a href="v4-modal-new-session.html" style="height: 50px; border-radius: 14px; border: 1.5px solid #D3D8E1; background: #FFFFFF; color: #141A26; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800; text-decoration: none; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>New session
