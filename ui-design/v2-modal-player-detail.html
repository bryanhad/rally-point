<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player detail modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1F5F99}a:hover{color:#174A78}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #141A26; position: relative; overflow: hidden">

  <div style="background: #2268A6; height: 128px; border-radius: 0 0 26px 26px"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14,18,26,0.55)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 211px; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 22px; font-weight: 800">Manage players</div>
    <div style="height: 48px; border-radius: 14px; border: 1.5px solid #E3E7EE"></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; justify-items: center; padding-top: 10px">
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #D5F0EC"></span>
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #EAE2FB"></span>
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #FBE1EC"></span>
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #FCEFD0"></span>
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #DDF2DF"></span>
    </div>
  </div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14,18,26,0.45)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="playerTitle" style="position: absolute; left: 16px; right: 16px; top: 250px; background: #FFFFFF; border-radius: 24px; padding: 12px 12px 18px; box-shadow: 0 20px 50px rgba(14,18,26,0.3); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: flex-end">
      <a href="v2-sheet-manage-players.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF1F5; color: #141A26; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </a>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: -30px">
      <span style="width: 88px; height: 88px; border-radius: 50%; background: #FBE1EC; color: #A3245C; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center">T</span>
      <div id="playerTitle" style="font-size: 22px; font-weight: 800">tiffany</div>
      <div style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #FDECEB; color: #A8322C; font-size: 12px; font-weight: 700">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #DD534C"></span>On court · Team Red
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 8px">
      <label for="playerName" style="font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: #5A6478">NAME</label>
      <div style="display: flex; gap: 8px">
        <input id="playerName" value="tiffany" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #2268A6; border-radius: 14px; padding: 0 14px; font-size: 16px; font-weight: 600; color: #141A26; background: #FFFFFF; box-shadow: 0 0 0 3px #E8F0F8">
        <button style="height: 48px; padding: 0 16px; border: none; border-radius: 14px; background: #2268A6; color: #FFFFFF; font-size: 15px; font-weight: 800">Save</button>
      </div>
    </div>

    <div style="height: 1px; background: #EEF1F5; margin: 2px 8px"></div>

    <div style="padding: 0 8px">
      <button style="width: 100%; height: 48px; border: none; border-radius: 14px; background: #FDF3F2; color: #B42318; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>Delete player
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

return {};
}
}

</body>
</html>
