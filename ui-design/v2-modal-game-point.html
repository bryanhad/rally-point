<style>

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #141A26; position: relative; overflow: hidden">

  <div style="background: #2268A6; height: 128px; border-radius: 0 0 26px 26px"></div>
  <div style="position: absolute; left: 12px; right: 12px; top: 192px; height: 210px; border-radius: 18px; background: #2B7A55"></div>
  <div style="position: absolute; left: 12px; top: 520px; width: 179px; height: 196px; border-radius: 22px; background: #2F62D6; color: #FFFFFF; font-size: 112px; font-weight: 800; display: flex; align-items: center; justify-content: center">11</div>
  <div style="position: absolute; right: 12px; top: 520px; width: 179px; height: 196px; border-radius: 22px; background: #DD534C; color: #FFFFFF; font-size: 112px; font-weight: 800; display: flex; align-items: center; justify-content: center">0</div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14,18,26,0.6)"></div>

  <div role="alertdialog" aria-modal="true" aria-labelledby="gpTitle" style="position: absolute; left: 16px; right: 16px; top: 190px; background: #FFFFFF; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(14,18,26,0.35)">
    <div style="height: 6px; background: #2F62D6"></div>
    <div style="padding: 22px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.22em; color: #2452B8">
          <svg width="18" height="14" viewBox="0 0 22 18"><path d="M1 5l5 4 5-8 5 8 5-4-2 11H3z" fill="#F2C94C" stroke="#C99A1A" stroke-width="1.2" stroke-linejoin="round"/></svg>GAME POINT
        </div>
        <div id="gpTitle" style="font-size: 22px; font-weight: 800">Team Blue reached 11</div>
      </div>

      <div style="width: 100%; box-sizing: border-box; border-radius: 16px; background: #EEF3FC; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="display: flex; flex-shrink: 0">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #EEF1F5; color: #3A4458; border: 2.5px solid #EEF3FC; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">P4</span>
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #EAE2FB; color: #5B3BA8; border: 2.5px solid #EEF3FC; margin-left: -12px; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">W</span>
        </div>
        <div style="flex: 1; min-width: 0; text-align: left; font-size: 15px; font-weight: 800; color: #1C3F8F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Player 4 &amp; wiliam</div>
        <div style="display: flex; gap: 3px; background: #141A26; padding: 4px; border-radius: 7px; flex-shrink: 0">
          <span style="width: 26px; height: 34px; border-radius: 4px; background: #262D3B; color: #F2C94C; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -3px 0 #4E7FEA">11</span>
          <span style="width: 26px; height: 34px; border-radius: 4px; background: #262D3B; color: #8A93A6; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -3px 0 #DD534C">0</span>
        </div>
      </div>

      <div style="font-size: 15px; line-height: 1.4; color: #5A6478">End the game now, or keep playing?</div>

      <div style="display: flex; flex-direction: column; gap: 8px; width: 100%">
        <a href="v2-modal-game-won.html" style="height: 50px; border-radius: 14px; background: #141A26; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">End game</a>
        <button style="height: 50px; border: none; border-radius: 14px; background: #EEF1F5; color: #141A26; font-size: 15px; font-weight: 700">Keep playing</button>
      </div>
      <div style="font-size: 12px; color: #8A93A6; margin-top: -6px">You can still end it later with <span style="font-weight: 700; color: #5A6478">End game</span>.</div>
    </div>
  </div>
</div>
