<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change player sheet</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1F5F99}a:hover{color:#174A78}
button,input{font-family:inherit}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #141A26; position: relative; overflow: hidden">

  <div style="background: #2268A6; height: 128px; border-radius: 0 0 26px 26px"></div>
  <div style="position: absolute; left: 12px; right: 12px; top: 192px; height: 210px; border-radius: 18px; background: #2B7A55"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14,18,26,0.55)"></div>

  <div role="dialog" aria-modal="true" aria-label="Change player for Team Blue" style="position: absolute; left: 0; right: 0; bottom: 0; top: 211px; background: #FFFFFF; border-radius: 26px 26px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px">
      <span style="width: 40px; height: 5px; border-radius: 3px; background: #D3D8E1"></span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 0 20px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: #2F62D6"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2F62D6"></span>TEAM BLUE</div>
        <div style="font-size: 22px; font-weight: 800">Replace wiliam</div>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #EEF1F5; color: #141A26; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="padding: 12px 16px 4px; position: relative">
      <label for="filter" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find a player</label>
      <svg style="position: absolute; left: 30px; top: 27px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A93A6" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="filter" placeholder="Find a player" style="width: 100%; height: 46px; box-sizing: border-box; border: none; border-radius: 14px; padding: 0 14px 0 42px; font-size: 16px; color: #141A26; background: #F2F4F7">
    </div>

    <div style="flex: 1; overflow: hidden; padding: 8px 12px 16px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 4px">

        <button style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #1F5F99">
          <span style="width: 60px; height: 60px; border-radius: 50%; border: 2px dashed #9DB8D4; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
          <span style="font-size: 14px; font-weight: 700">New player</span>
          <span style="height: 18px"></span>
        </button>

        <button style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #D5F0EC; color: #0F6B5E; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center">B</span>
          <span style="font-size: 14px; font-weight: 700">bryan</span>
          <span style="height: 18px"></span>
        </button>

        <button aria-label="wiliam, current player" aria-current="true" style="border: none; background: #F2F4F7; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #EAE2FB; color: #5B3BA8; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #F2F4F7, 0 0 0 5px #141A26">W</span>
          <span style="font-size: 14px; font-weight: 700">wiliam</span>
          <span style="height: 18px; padding: 0 8px; border-radius: 999px; background: #141A26; color: #FFFFFF; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; display: flex; align-items: center">CURRENT</span>
        </button>

        <button aria-label="tiffany, on court for Team Red" style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #FBE1EC; color: #A3245C; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #DD534C">T</span>
          <span style="font-size: 14px; font-weight: 700">tiffany</span>
          <span style="height: 18px; padding: 0 8px; border-radius: 999px; background: #FDECEB; color: #A8322C; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; display: flex; align-items: center">TEAM RED</span>
        </button>

        <button style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #FCEFD0; color: #8A5A00; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center">H</span>
          <span style="font-size: 14px; font-weight: 700">hansen</span>
          <span style="height: 18px"></span>
        </button>

        <button style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #DDF2DF; color: #256B2E; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center">RW</span>
          <span style="max-width: 100%; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">reinaldri w.</span>
          <span style="height: 18px"></span>
        </button>

        <button aria-label="Player 1, on court for Team Red" style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #EEF1F5; color: #3A4458; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #DD534C">P1</span>
          <span style="font-size: 14px; font-weight: 600; color: #3A4458">Player 1</span>
          <span style="height: 18px; padding: 0 8px; border-radius: 999px; background: #FDECEB; color: #A8322C; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; display: flex; align-items: center">TEAM RED</span>
        </button>

        <button style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #EEF1F5; color: #3A4458; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center">P2</span>
          <span style="font-size: 14px; font-weight: 600; color: #3A4458">Player 2</span>
          <span style="height: 18px"></span>
        </button>

        <button style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #EEF1F5; color: #3A4458; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center">P3</span>
          <span style="font-size: 14px; font-weight: 600; color: #3A4458">Player 3</span>
          <span style="height: 18px"></span>
        </button>

        <button aria-label="Player 4, on court for Team Blue" style="border: none; background: transparent; border-radius: 16px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #141A26">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #EEF1F5; color: #3A4458; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #2F62D6">P4</span>
          <span style="font-size: 14px; font-weight: 600; color: #3A4458">Player 4</span>
          <span style="height: 18px; padding: 0 8px; border-radius: 999px; background: #E6EDFB; color: #2452B8; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; display: flex; align-items: center">TEAM BLUE</span>
        </button>
      </div>
    </div>
  </div>
</div>
