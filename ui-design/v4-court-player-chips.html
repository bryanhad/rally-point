        <div style="position: absolute; left: 6px; top: 16px; display: flex; align-items: center">
          <span style="position: relative; z-index: 1; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #E9918C; background: #D8EEF7; color: #0E6385; box-sizing: border-box; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">AP</span>

    <div style="display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px 8px; align-items: center; font-size: 13px; color: #5A6478; font-weight: 600">
      <span>Serving</span>
      <div style="display: flex; align-items: center; background: #53926B; border-radius: 12px; padding: 6px 8px; justify-self: start">
        <span style="position: relative; z-index: 1; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #F2C94C; background: #FBE1EC; color: #A3245C; box-sizing: border-box; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">T</span>

      </div>
      <span>Receiving</span>
      <div style="display: flex; align-items: center; background: #53926B; border-radius: 12px; padding: 6px 8px; justify-self: start">
        <span style="position: relative; z-index: 1; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #FFFFFF; background: #FDE5D6; color: #9A4210; box-sizing: border-box; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">BH</span>
        <span style="height: 30px; margin-left: -14px; padding: 0 12px 0 20px; border-radius: 0 999px 999px 0; background: #3E62D1; color: #FFFFFF; font-size: 13px; font-weight: 800; display: block; line-height: 30px; max-width: 116px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">bryan hadinata</span>
      </div>
      <span>Idle</span>
      <div style="display: flex; align-items: center; background: #53926B; border-radius: 12px; padding: 6px 8px; justify-self: start">
        <span style="position: relative; z-index: 1; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #8FA6EA; background: #EAE2FB; color: #5B3BA8; box-sizing: border-box; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">W</span>
        <span style="height: 30px; margin-left: -14px; padding: 0 12px 0 20px; border-radius: 0 999px 999px 0; background: #3E62D1; color: #FFFFFF; font-size: 13px; font-weight: 800; display: block; line-height: 30px; max-width: 116px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">wiliam</span>
      </div>
      <span>Long name (cut off)</span>
      <div style="display: flex; align-items: center; background: #53926B; border-radius: 12px; padding: 6px 8px; justify-self: start">
        <span style="position: relative; z-index: 1; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #E9918C; background: #DDF2DF; color: #256B2E; box-sizing: border-box; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">RW</span>

      </div>
    </div>
  </div>
</div>
